# Configuration for gitleaks, which .github/workflows/secrets.yml runs over the
# whole history.
#
# The upstream rules are the useful part; everything here is a correction to
# them for this repository. Keep this file short. A long allowlist is a scanner
# nobody trusts, and the point of running a generic detector is that it finds
# the shapes we did not think to look for.
#
# tools/checksecrets is the other scanner and is not replaced by this one. It
# knows things about this project that no general tool can -- which hostnames
# are ours, and that a private key header must never appear in any file.

[extend]
# Take the default rule set rather than restating it, so a detector added
# upstream arrives here without a change.
useDefault = true

[allowlist]
description = "Vendored code, and the marker that exists so no real header does"

paths = [
  # Vendored dependencies and installed packages are somebody else's code. A
  # finding in them is theirs to fix and ours to upgrade past, which is what
  # govulncheck already watches for.
  '''^vendor/''',
  '''^web/node_modules/''',
  '''^web/package-lock\.json$''',
]

regexes = [
  # internal/browser/certificates_test.go, in the test that a pasted private
  # key is EXPLAINED rather than passed on to certutil. The file goes out of
  # its way to contain no literal header -- privateKeyMarker is concatenated
  # from two halves, because tools/checksecrets refuses one wherever it
  # appears -- and gitleaks reads the assembled source and finds it anyway.
  #
  # What is in the fixture is the PKCS#8 header for a P-256 key and nothing
  # else: 36 bytes, cut off exactly where the 32-byte private scalar would
  # start. There is no key material in it.
  #
  # Which is why this matches the TRUNCATION rather than the prefix. Those
  # forty-eight characters open every real P-256 key too, so allowing them
  # alone would allow the genuine article; requiring the string to end there,
  # at the Go concatenation, allows only something that stops before the
  # secret begins.
  '''MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg\\n" \+''',
]
