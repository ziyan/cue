version: "2"

run:
  timeout: 5m

linters:
  # In golangci-lint v2 the exclusions live here, under linters. They used to
  # live under `issues`, where this file kept them for a while — and where they
  # were quietly ignored, which is why the first CI run reported unchecked
  # Close calls in test files that this rule was written to allow.
  exclusions:
    paths:
      - vendor
    rules:
      - path: _test\.go
        linters:
          - errcheck

  settings:
    revive:
      rules:
        # Receiver names must use `self` by project convention.
        - name: receiver-naming
          disabled: true
    staticcheck:
      checks:
        - all
        # Identifier initialism casing follows this project's own rule: an
        # acronym is fully capitalised only when the identifier starts with a
        # capital. See CONTRIBUTING.md.
        - -ST1003
        # Receiver names must use `self` by project convention.
        - -ST1006

output:
  formats:
    text:
      path: stdout
      colors: true
