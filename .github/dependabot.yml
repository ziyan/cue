# Dependency updates, proposed as pull requests.
#
# Weekly rather than daily: a pull request every morning is a pull request
# nobody reads. Weekly is often enough that an update is a small diff and rare
# enough that somebody looks at it.
#
# The Go dependencies are vendored, and Dependabot updates vendor/ along with
# go.mod and go.sum -- without that the build, which uses -mod=vendor, would
# break on every one of these.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      golang-x:
        patterns: ['golang.org/x/*']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Build tooling, which changes together and is not shipped to anybody.
      build:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
