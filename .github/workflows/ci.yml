name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  daemon:
    name: Daemon
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false # dependencies are vendored

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Before anything Go: the daemon embeds the built interface, so every
      # step below compiles against whatever this produced. Without it they
      # compile against an empty directory and prove nothing about what ships.
      - name: Build the interface
        run: make web

      - name: Check the interface
        run: cd web && npx tsc --noEmit

      - name: Check formatting
        run: make check

      - name: Vet
        run: go vet -mod=vendor . ./cmd/... ./internal/... ./tools/...

      - name: Build
        run: make build

      # mulint is deliberately absent: it is a local-only check, so a
      # contributor without it installed is never blocked. See mulint.yaml.
      - name: Lint
        run: make lint-ci

      - name: Test
        run: |
          go install gotest.tools/gotestsum@latest
          gotestsum --format testname -- -mod=vendor -race -cover \
            -coverprofile=coverage.out . ./cmd/... ./internal/... ./tools/...
          go tool cover -func=coverage.out | tail -1

  image:
    name: Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The test binaries are compiled here and only run inside the image, so
      # this job needs the interface as much as the other one does.
      - name: Build the interface
        run: make web

      # Building the image on every change catches the two ways it silently
      # breaks: a package that has been renamed, and the collection step
      # dropping a library nothing noticed was missing until the X server
      # would not start.
      # The image is published for two architectures, and a package that
      # exists for one and not the other only fails at the moment of release,
      # after everything else has succeeded. Asking Debian's index takes ten
      # seconds; finding out by building under emulation takes twenty minutes.
      - name: Check the packages exist for every architecture
        run: make check-packages

      - name: Build
        run: docker build -f Dockerfile -t cue:ci .

      - name: Check it runs
        run: docker run --rm cue:ci version

      # Some tests need a program the image has and a build machine does not:
      # certutil, which is how a certificate an operator pastes in actually
      # comes to be trusted. On a build machine those tests skip, and a skip
      # proves nothing — the point of them is that the image has what the code
      # needs. Run inside the image, nothing skips.
      - name: Test inside the image
        run: make docker-test DOCKER_TAG=cue:ci

      # The real check. This starts the whole daemon inside the image against
      # a virtual screen and proves it puts a picture on it: every program
      # running, a screenshot of the configured size, the playlist rotating,
      # and the watchdog satisfied. A machine with no display attached can
      # still tell whether the display works.
      - name: Prove it puts a picture on the screen
        run: go run ./tools/smoke -image cue:ci
