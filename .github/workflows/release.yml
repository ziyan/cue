name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 0.2.0'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes come from the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Read the notes before building anything: a release with no changelog
      # entry should fail in ten seconds rather than after ten minutes.
      - name: Collect the release notes
        run: go run ./tools/changelog "${{ steps.version.outputs.version }}" | tee release-notes.md

      # Before spending twenty minutes building for two architectures under
      # emulation, check that both can actually be built.
      - name: Check the packages exist for every architecture
        run: make check-packages

      - name: Build the binaries
        run: go run ./tools/release "${{ steps.version.outputs.version }}" dist

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the GitHub registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional. A fork, or this repository before the two
      # secrets are set, still publishes to the GitHub registry rather than
      # failing the release over a registry it was never going to reach.
      #
      # Whether it is configured is decided here, in a step that can read the
      # secret into the environment, so that the steps below can be gated on an
      # ordinary output. The Docker Hub repository defaults to the same owner
      # and name as this one; set the DOCKERHUB_REPOSITORY variable if it lives
      # somewhere else.
      - name: Work out where the image goes
        id: images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            echo "dockerhub=yes" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=no" >> "$GITHUB_OUTPUT"
            echo "no Docker Hub credentials; publishing to the GitHub registry only"
          fi
          {
            echo 'tags<<TAGS'
            echo "ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
            echo "ghcr.io/${GITHUB_REPOSITORY}:latest"
            if [ -n "${DOCKERHUB_USERNAME}" ]; then
              repository="${DOCKERHUB_REPOSITORY:-${GITHUB_REPOSITORY}}"
              echo "docker.io/${repository}:v${VERSION}"
              echo "docker.io/${repository}:latest"
            fi
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Sign in to Docker Hub
        if: steps.images.outputs.dockerhub == 'yes'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.images.outputs.tags }}

      # Last, so that a release that exists is a release that finished. The
      # first one was published before the image was built, and when the arm64
      # build failed it left a version tagged, announced and downloadable with
      # no image behind it.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/cue-linux-amd64
            dist/cue-linux-arm64
            dist/SHA256SUMS
