# Cue on a device with a screen attached.
#
#     docker compose -f deploy/docker-compose.yml up -d
#
# Then open http://<this machine>:8080/ from a laptop on the same network. The
# screen itself shows that address until the device has been set up.

services:
  cue:
    image: ghcr.io/ziyan/cue:latest
    container_name: cue
    restart: unless-stopped

    # Bound the log, because nothing else does. Docker keeps everything by
    # default, and a screen is a machine nobody logs in to for a year at a
    # time: whatever it repeats, it repeats until the disk is full.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

    # The host's network namespace, for three reasons:
    #
    #   - The web interface and the VNC server answer on the machine's own
    #     address, which is what somebody types into a laptop.
    #   - Kernel hotplug events are delivered per namespace, so a container on
    #     a bridge network never hears a monitor being plugged in. Polling
    #     /sys covers it either way, but the events make it instant.
    #   - The machine's network interfaces live in this namespace and nowhere
    #     else, so managing them — joining a wireless network, setting a fixed
    #     address — is only possible here.
    #
    # It costs one thing worth knowing about: the browser's debugging port is
    # then on a namespace shared with everything else on the machine. The
    # daemon therefore lets the browser choose its own port and reads it back
    # from the browser's profile. Assuming a fixed port once meant driving a
    # headless Chrome that something unrelated had left on 9222, while the
    # screen sat on a page nobody had ever navigated.
    network_mode: host

    # The X server needs the graphics device, two consoles, and — if anybody is
    # going to touch or type at the screen — the input devices.
    #
    # The two consoles are the part that is not obvious and that was got wrong
    # once. /dev/tty0 is how the server talks to the console layer at all.
    # /dev/tty2 is the console it draws on, and it has to be passed through
    # by name: left to itself the server asks the kernel for a free console,
    # is told a number, and opens /dev/tty<number> — which is not in the
    # container, and it dies with "xf86OpenConsole: Cannot open virtual
    # console 3". So display.virtualTerminal names it, and this list matches.
    # Change both together or neither.
    devices:
      - /dev/dri:/dev/dri
      - /dev/tty0:/dev/tty0
      - /dev/tty2:/dev/tty2
      - /dev/input:/dev/input
      # Sound, if the screen has speakers. Harmless when it has none.
      - /dev/snd:/dev/snd

    cap_add:
      # Switching the virtual console away from the text console.
      - SYS_TTY_CONFIG
      # Setting the system clock, which chronyd does. Without it the clock is
      # never corrected and a device whose battery has died shows certificate
      # errors instead of the dashboard.
      - SYS_TIME
      # This one is what lets the browser keep its own sandbox, and it is
      # worth being clear about because it looks alarming.
      #
      # Chromium's sandbox creates process and network namespaces, and a
      # container's default seccomp policy refuses that unless the container
      # has this capability. Granting it does not turn seccomp off — the
      # policy is capability-aware, so every other syscall stays filtered.
      #
      # The trade is favourable. This container is already root with the
      # graphics device, the console and host networking; that is what driving
      # a screen costs. The browser is the one thing here that processes
      # anything from the internet, so it is the one thing worth sandboxing,
      # and without this it will not start at all. If you would rather not
      # grant it, set browser.sandbox to false — the screen then works, with a
      # bug in a web page one step closer to everything else in here.
      - SYS_ADMIN
      # Configuring the machine's network interfaces and joining wireless
      # networks. Without it the Network page can report but not change.
      - NET_ADMIN
      # The X server maps the graphics hardware directly.
      - SYS_RAWIO

    # Chromium allocates its shared memory here. Docker's default is 64
    # megabytes, which a browser showing video exhausts, and the tab then
    # crashes with no explanation anybody can act on.
    shm_size: 1gb

    volumes:
      # The configuration. Mount the *directory*, not the file: the daemon
      # rewrites the file atomically, and a rename cannot replace a file that
      # is itself a bind mount.
      - /etc/cue:/etc/cue
      # The browser profile, the device identifier, and — if the device is
      # enrolled — its fleet credential.
      - /var/lib/cue:/var/lib/cue

    # The health check is the daemon's own: it reports unhealthy when the
    # browser is not running, and stays healthy through a planned restart so
    # that recovering from a fault is not interrupted by being killed.
    healthcheck:
      test: ["CMD", "/usr/local/bin/cue", "health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

# If the screen stays black, the reason is in the X server's own log, and the
# daemon prints the end of it whenever a start fails — "docker logs cue" has
# it, and so does the Device page in the web interface. The four usual causes,
# in the order they are worth checking:
#
#   - A display manager (gdm, lightdm, sddm) is running and already holds the
#     graphics device. Stop and disable it: systemctl disable --now gdm3
#   - /dev/dri was not passed through, so there is nothing to drive. The log
#     then ends with "Screen 0 deleted because of no matching config section",
#     and "docker exec cue cue display probe" reports no connectors at all.
#   - The console named above and display.virtualTerminal disagree. The log
#     says "xf86OpenConsole: Cannot open virtual console N"; pass /dev/ttyN
#     through, or set display.virtualTerminal to a console you did pass.
#   - Something else is already on that console. Pick another one, in both
#     places.
#
# As a last resort, "privileged: true" with "- /dev:/dev" in volumes gives the
# container everything, which is worth trying once to find out whether the
# problem is a permission at all. Do not leave it that way: it is access to
# every device on the machine.
