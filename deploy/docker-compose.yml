# Cue on a device with a screen attached.
#
#     docker compose -f deploy/docker-compose.yml up -d
#
# Then open http://<this machine>:8080/ from a laptop on the same network. The
# screen itself shows that address until the device has been set up.

services:
  cue:
    image: ghcr.io/ziyan/cue:latest
    container_name: cue
    restart: unless-stopped

    # Host networking, for three reasons that all matter:
    #
    #   - The web interface and the VNC server should answer on the machine's
    #     own address, which is what somebody types into a laptop.
    #   - Kernel hotplug events are delivered per network namespace, so a
    #     container on a bridge network never hears a monitor being plugged
    #     in. Cue falls back to polling /sys, which works either way, but the
    #     events are what make it instant.
    #   - A kiosk usually shows something on the same local network, and
    #     bridge networking puts a translation layer between them for nothing.
    network_mode: host

    # The X server needs the graphics device, the virtual console it draws
    # on, and — if anybody is going to touch or type at the screen — the input
    # devices. This is the smallest set that works; see the note below if the
    # screen stays black.
    devices:
      - /dev/dri:/dev/dri
      - /dev/tty0:/dev/tty0
      - /dev/input:/dev/input
      # Sound, if the screen has speakers. Harmless when it has none.
      - /dev/snd:/dev/snd

    cap_add:
      # Switching the virtual console away from the text console.
      - SYS_TTY_CONFIG
      # Setting the system clock, which chronyd does. Without it the clock is
      # never corrected and a device whose battery has died shows certificate
      # errors instead of the dashboard.
      - SYS_TIME
      # The X server maps the graphics hardware directly.
      - SYS_RAWIO

    # Chromium allocates its shared memory here. Docker's default is 64
    # megabytes, which a browser showing video exhausts, and the tab then
    # crashes with no explanation anybody can act on.
    shm_size: 1gb

    volumes:
      # The configuration. Mount the *directory*, not the file: the daemon
      # rewrites the file atomically, and a rename cannot replace a file that
      # is itself a bind mount.
      - /etc/cue:/etc/cue
      # The browser profile, the device identifier, and — if the device is
      # enrolled — its fleet credential.
      - /var/lib/cue:/var/lib/cue

    # The health check is the daemon's own: it reports unhealthy when the
    # browser is not running, and stays healthy through a planned restart so
    # that recovering from a fault is not interrupted by being killed.
    healthcheck:
      test: ["CMD", "/usr/local/bin/cue", "health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

# If the screen stays black, look at the X server's log — the Device page in
# the web interface shows the end of it, and so does
# "docker exec cue cue display probe". The two usual causes:
#
#   - /dev/dri was not passed through, so there is no graphics device to
#     drive. "cue display probe" then reports no connectors at all.
#   - The machine is running a display manager (gdm, lightdm, sddm) which
#     already holds the graphics device. Stop and disable it:
#     systemctl disable --now gdm3
#
# As a last resort, "privileged: true" with "- /dev:/dev" in volumes gives the
# container everything, which is worth trying once to find out whether the
# problem is a permission at all. Do not leave it that way.
