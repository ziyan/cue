# Cue against a virtual screen, for a machine with no display attached: a
# laptop being developed on, or a continuous integration runner.
#
#     docker compose -f deploy/docker-compose.dev.yml up
#
# Everything runs — the X server, the browser, the VNC server, the interface —
# but the picture is drawn into memory rather than onto a screen. The
# screenshot endpoint and the Screen page both work, which is enough to see
# that a change did what it was meant to.

services:
  cue:
    image: cue:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: cue-dev
    shm_size: 1gb
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5900:5900"
    volumes:
      - ./dev/etc:/etc/cue
      - ./dev/state:/var/lib/cue
    environment:
      CUE_LOG_LEVEL: DEBUG
    command: ["run"]
